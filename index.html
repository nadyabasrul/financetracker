<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 glass p-6 rounded-2xl">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white">Finance Tracker</h1>
                <p id="current-date" class="text-sm text-slate-400 mt-1"></p>
            </div>
            <button onclick="openModal()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold px-5 py-2.5 rounded-xl transition shadow-lg shadow-emerald-500/20 flex items-center gap-2">
                <span>+ Add Transaction</span>
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="glass p-5 rounded-2xl">
                <p class="text-sm text-slate-400">Total Income</p>
                <h3 id="total-income" class="text-2xl font-bold text-emerald-400 mt-1">Rp0.00</h3>
            </div>
            <div class="glass p-5 rounded-2xl">
                <p class="text-sm text-slate-400">Total Expenses</p>
                <h3 id="total-expenses" class="text-2xl font-bold text-rose-400 mt-1">Rp.00</h3>
            </div>
            <div class="glass p-5 rounded-2xl">
                <p class="text-sm text-slate-400">Net Profit</p>
                <h3 id="net-profit" class="text-2xl font-bold mt-1">$0.00</h3>
            </div>
        </div>

        <div class="glass p-6 rounded-2xl space-y-4">
            <h2 class="text-lg font-semibold">Recent Transactions</h2>
            <div id="transaction-list" class="space-y-3">
                <p class="text-sm text-slate-400 text-center py-4">Memuat data dari Google Sheets...</p>
            </div>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="glass w-full max-w-md p-6 rounded-2xl space-y-4 relative border border-slate-700">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold">Add Transaction</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl">&times;</button>
            </div>
            <form id="transaction-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Type</label>
                    <select id="type" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                        <option value="Expense">Expense</option>
                        <option value="Income">Income</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Description</label>
                    <input type="text" id="description" required placeholder="e.g., Lunch" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Amount (Rp)</label>
                    <input type="number" step="0.01" id="amount" required placeholder="0.00" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Category</label>
                    <select id="category" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                        <option value="Food & Dining">Food & Dining</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Bills & Utilities">Bills & Utilities</option>
                        <option value="Salary">Salary</option>
                    </select>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold py-2.5 rounded-xl transition">Add Transaction</button>
            </form>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycby5EkZEMZlF9Uf0AzEYUDh_coaa9YqNLPMuHxWU-q6Y2n43uVDmqhXX7e6vVAsg2-gS/exec';
        const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', options);

        function openModal() { document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('flex'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); document.getElementById('modal').classList.remove('flex'); }

        async function fetchTransactions() {
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                renderData(data);
            } catch (error) {
                console.error('Gagal mengambil data:', error);
                document.getElementById('transaction-list').innerHTML = `<p class="text-sm text-rose-400 text-center py-4">Gagal memuat data dari Spreadsheet.</p>`;
            }
        }

        function renderData(transactions) {
            const listEl = document.getElementById('transaction-list');
            listEl.innerHTML = '';

            let totalInc = 0;
            let totalExp = 0;

            if (!transactions || transactions.length === 0) {
                listEl.innerHTML = `<p class="text-sm text-slate-400 text-center py-4">Belum ada transaksi di Spreadsheet.</p>`;
                document.getElementById('total-income').innerText = `$0.00`;
                document.getElementById('total-expenses').innerText = `$0.00`;
                document.getElementById('net-profit').innerText = `$0.00`;
                return;
            }

            // Loop data dari spreadsheet (memakai header huruf besar: TYPE, DESCRIPTION, AMOUNT, CATEGORY, DATE)
            [...transactions].reverse().forEach(tx => {
                const amount = parseFloat(tx.AMOUNT) || 0;
                const type = tx.TYPE ? tx.TYPE.trim() : 'Expense';
                
                if (type === 'Income') {
                    totalInc += amount;
                } else {
                    totalExp += amount;
                }

                const isIncome = type === 'Income';
                const sign = isIncome ? '+' : '-';
                const colorClass = isIncome ? 'text-emerald-400' : 'text-slate-100';

                const itemHTML = `
                    <div class="flex justify-between items-center bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                        <div>
                            <h4 class="font-medium text-sm text-white">Rp{tx.DESCRIPTION || 'Tanpa Keterangan'}</h4>
                            <p class="text-xs text-slate-400">Rp{tx.CATEGORY || 'General'} • Rp{tx.DATE || ''}</p>
                        </div>
                        <span class="font-semibold text-sm Rp{colorClass}">Rp{sign}Rp{amount.toFixed(2)}</span>
                    </div>
                `;
                listEl.innerHTML += itemHTML;
            });

            document.getElementById('total-income').innerText = `Rp{totalInc.toFixed(2)}`;
            document.getElementById('total-expenses').innerText = `Rp{totalExp.toFixed(2)}`;
            
            const netProfit = totalInc - totalExp;
            const netEl = document.getElementById('net-profit');
            netEl.innerText = `Rp{netProfit.toFixed(2)}`;
            netEl.className = `text-2xl font-bold mt-1 Rp{netProfit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = 'Menyimpan...';
            submitBtn.disabled = true;

            const newData = {
                id: 'TX-' + Date.now(),
                type: document.getElementById('type').value,
                description: document.getElementById('description').value,
                amount: document.getElementById('amount').value,
                category: document.getElementById('category').value,
                date: new Date().toLocaleDateString('en-US')
            };

try {
    const response = await fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // bukan application/json
        body: JSON.stringify(newData)
    });
    const result = await response.json();

    if (result.result === 'success') {
        closeModal();
        document.getElementById('transaction-form').reset();
        setTimeout(fetchTransactions, 1000);
    } else {
        alert('Gagal menyimpan: ' + result.message);
    }
} catch (error) {
    console.error('Error:', error);
    alert('Terjadi kesalahan saat menyimpan data.');
}
            finally {
                submitBtn.innerText = 'Add Transaction';
                submitBtn.disabled = false;
            }
        }

        fetchTransactions();
    </script>
</body>
</html>
